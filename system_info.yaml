- name: Gather system information
  hosts: allservers
  become: yes
  gather_facts: yes

  tasks:
    - name: Display hostname
      ansible.builtin.debug:
        var: ansible_hostname

    - name: Display IP address
      ansible.builtin.debug:
        var: ansible_default_ipv4.address

    - name: Display OS version
      ansible.builtin.debug:
        var: ansible_distribution